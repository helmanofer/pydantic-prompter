on:
  push:
    branches:
      - main
      - docs*
name: publish docs
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: pip install uv
      - name: Install and build docs
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install mkdocs-material
          mkdocs gh-deploy --force
