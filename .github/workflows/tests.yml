on:
  push:
    branches:
      - '*'
name: run tests
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install uv
      - name: Install dependencies
        run: |
          uv venv
          uv pip sync uv.lock
          uv pip install -e .
      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest
